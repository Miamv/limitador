# Configuración de pruebas con H2 en memoria y credenciales seguras de testing
spring.datasource.url=jdbc:h2:mem:limitador_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Clave secreta fija de 64 bytes para pruebas unitarias e integración de JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# Rutas de las bases de datos MaxMind GeoLite2
geolite.city-database-path=classpath:geolite/GeoLite2-City.mmdb
geolite.country-database-path=classpath:geolite/GeoLite2-Country.mmdb
geolite.asn-database-path=classpath:geolite/GeoLite2-ASN.mmdb
