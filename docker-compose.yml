services:
  db:
    image: postgres:17-alpine
    container_name: limitador-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-limitador_db}
      POSTGRES_USER: ${POSTGRES_USER:-${SPRING_DATASOURCE_USERNAME:-postgres}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${SPRING_DATASOURCE_PASSWORD:-postgres}}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${SPRING_DATASOURCE_USERNAME:-postgres}} -d ${POSTGRES_DB:-limitador_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: auth:${APP_VERSION:-_v1.1.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: limitador-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/limitador_db}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      - JWT_REMEMBER_ME_EXPIRATION_MS=${JWT_REMEMBER_ME_EXPIRATION_MS:-604800000}
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:-20s}
      - GEOIP_DATABASE_CITY_PATH=${GEOIP_DATABASE_CITY_PATH:-file:/geolite/GeoLite2-City.mmdb}
      - GEOIP_DATABASE_COUNTRY_PATH=${GEOIP_DATABASE_COUNTRY_PATH:-file:/geolite/GeoLite2-Country.mmdb}
      - GEOIP_DATABASE_ASN_PATH=${GEOIP_DATABASE_ASN_PATH:-file:/geolite/GeoLite2-ASN.mmdb}
      - GEOIP_DATABASE_CACHE_SIZE=${GEOIP_DATABASE_CACHE_SIZE:-4096}
    volumes:
      # Bases MaxMind GeoLite2 (.mmdb): montadas como volumen
      - ${GEOLITE_DIR:-./src/main/resources/geolite}:/geolite:ro
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
